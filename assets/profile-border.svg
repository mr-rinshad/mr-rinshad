<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circleClip">
      <circle cx="110" cy="110" r="90"/>
    </clipPath>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F7FF"/>
      <stop offset="50%" stop-color="#FF00E5"/>
      <stop offset="100%" stop-color="#00F7FF"/>
    </linearGradient>
  </defs>

  <circle cx="110" cy="110" r="100" fill="none" stroke="url(#glowGradient)"
          stroke-width="6" stroke-linecap="round" stroke-dasharray="200 428">
    <animateTransform attributeName="transform" type="rotate"
      from="0 110 110" to="360 110 110" dur="3s" repeatCount="indefinite"/>
  </circle>

  <image href="https://raw.githubusercontent.com/mr-rinshad/mr-rinshad/main/assets/profile.PNG"
         x="20" y="20" width="180" height="180"
         clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid slice"/>
</svg>
